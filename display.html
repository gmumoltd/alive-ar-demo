<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIVE · Artwork</title>
<style>
  html,body { margin:0; height:100%; background:#14141e; color:#f0f0e6; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; gap:48px; padding:24px; box-sizing:border-box; flex-wrap:wrap; }
  img.art { max-height:calc(100vh - 48px); max-width:100%; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .side { max-width:260px; text-align:center; }
  #qr { background:#fff; padding:12px; border-radius:12px; display:inline-block; line-height:0; }
  #qr svg { width:200px; height:200px; }
  h2 { color:#ffc400; margin:16px 0 6px; }
  p { color:#a4a4b4; line-height:1.45; margin:0; }
  code { color:#f0f0e6; word-break:break-all; font-size:12px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
  <img class="art" src="assets/artwork.jpg" alt="ALIVE sample artwork">
  <div class="side">
    <div id="qr"></div>
    <h2>Scan with your phone</h2>
    <p>Open the link, tap <b>Start camera</b>, then point your phone at the artwork on this screen.</p>
    <p style="margin-top:10px"><code id="url"></code></p>
  </div>
<script>
  const url = new URL('index.html', location.href).href.replace(/index\.html$/, '');
  document.getElementById('url').textContent = url;
  try {
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0 });
  } catch (e) { document.getElementById('qr').style.display = 'none'; }
</script>
</body>
</html>
