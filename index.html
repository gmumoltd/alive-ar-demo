<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ALIVE · AR Art Demo</title>
<style>
  :root { --bg:#14141e; --card:#1f1f2c; --text:#f0f0e6; --muted:#a4a4b4; --accent:#ffc400; --accent2:#ff5e3a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  #ar { position:fixed; inset:0; overflow:hidden; }
  /* ---------- start screen ---------- */
  #start { position:fixed; inset:0; z-index:10; overflow-y:auto; padding:28px 20px 40px;
    display:flex; flex-direction:column; align-items:center; background:var(--bg); }
  .wrap { width:100%; max-width:440px; }
  h1 { font-size:44px; margin:8px 0 4px; letter-spacing:1px; color:var(--accent); }
  .sub { color:var(--muted); margin:0 0 24px; line-height:1.45; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; }
  .choice { display:flex; gap:12px; align-items:flex-start; cursor:pointer; }
  .choice input[type=radio] { margin-top:4px; accent-color:var(--accent); width:18px; height:18px; flex:none; }
  .choice b { display:block; margin-bottom:3px; }
  .choice span { color:var(--muted); font-size:14px; line-height:1.4; }
  #own { display:none; margin-top:14px; }
  #own label { display:block; font-size:14px; color:var(--muted); margin:10px 0 6px; }
  #own input[type=file] { width:100%; color:var(--text); font-size:14px; }
  .btn { display:block; width:100%; border:0; border-radius:14px; padding:16px; font-size:18px; font-weight:700;
    background:var(--accent); color:#14141e; cursor:pointer; margin-top:8px; }
  .btn:disabled { opacity:.5; }
  .link { display:block; text-align:center; color:var(--muted); margin-top:18px; font-size:14px; }
  .link a { color:var(--text); }
  #status { margin-top:14px; text-align:center; color:var(--muted); min-height:1.4em; font-size:15px; }
  .bar { height:6px; background:#2c2c3c; border-radius:3px; overflow:hidden; margin-top:8px; display:none; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  /* ---------- AR overlay ---------- */
  #hint { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); z-index:5; display:none;
    background:rgba(20,20,30,.78); padding:12px 18px; border-radius:30px; font-size:15px; white-space:nowrap; }
  #frame { position:fixed; z-index:4; left:50%; top:45%; width:60vw; max-width:320px; aspect-ratio:3/4;
    transform:translate(-50%,-50%); border:3px dashed rgba(255,255,255,.7); border-radius:14px; display:none;
    animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  #controls { position:fixed; top:14px; right:14px; z-index:6; display:none; gap:8px; }
  #controls button { border:0; border-radius:22px; padding:10px 14px; font-size:15px;
    background:rgba(20,20,30,.78); color:var(--text); }
  .err { color:var(--accent2) !important; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>
<div id="ar"></div>
<div id="frame"></div>
<div id="hint">Point your camera at the artwork</div>
<div id="controls"><button id="sound">🔇 Sound off</button></div>

<div id="start">
  <div class="wrap">
    <h1>ALIVE</h1>
    <p class="sub">Point your phone at the artwork and watch it come to life. No app needed.</p>

    <div class="card">
      <label class="choice">
        <input type="radio" name="mode" value="sample" checked>
        <div><b>Use the sample artwork</b>
          <span>Open <a href="display.html" style="color:var(--text)">the artwork page</a> on a laptop, or print <a href="assets/artwork.jpg" style="color:var(--text)">artwork.jpg</a>, then aim your phone at it.</span></div>
      </label>
    </div>

    <div class="card">
      <label class="choice">
        <input type="radio" name="mode" value="own">
        <div><b>Try your own artwork</b>
          <span>Pick a picture and a video from your phone. Nothing gets uploaded. It all stays on your phone.</span></div>
      </label>
      <div id="own">
        <label for="imgFile">1. Artwork image (detailed, high-contrast images work best)</label>
        <input id="imgFile" type="file" accept="image/*">
        <label for="vidFile">2. Video to play on top (short MP4 works best)</label>
        <input id="vidFile" type="file" accept="video/*">
      </div>
    </div>

    <button class="btn" id="go">Start camera</button>
    <div class="bar" id="bar"><i></i></div>
    <div id="status"></div>
    <div class="link">On a computer? <a href="display.html">Show the artwork + QR code</a></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

const COMPILER_URL = 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';
const SAMPLE = { image: 'assets/artwork.jpg', video: 'assets/video.mp4', target: 'assets/targets.mind' };

const $ = (id) => document.getElementById(id);
const statusEl = $('status'), bar = $('bar'), barFill = bar.querySelector('i');
const setStatus = (msg, isErr = false) => { statusEl.textContent = msg; statusEl.classList.toggle('err', isErr); };

// Show/hide the "own files" pickers
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', () => {
  $('own').style.display = document.querySelector('input[name=mode]:checked').value === 'own' ? 'block' : 'none';
}));

if (!window.isSecureContext) {
  setStatus('The camera only works on a secure (https://) website. Put this folder online first (see README).', true);
}

// Load an image and shrink it (big phone photos make tracking setup very slow)
function loadImage(src, maxSide = 1000) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      if (scale === 1) return resolve(img);
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const out = new Image();
      out.onload = () => resolve(out);
      out.onerror = reject;
      out.src = c.toDataURL('image/jpeg', 0.92);
    };
    img.onerror = () => reject(new Error('Could not load the artwork image.'));
    img.src = src;
  });
}

// Turn the artwork image into a "target" file MindAR can recognise (done right here in the browser)
async function compileTarget(img) {
  setStatus('Preparing the artwork for tracking…');
  bar.style.display = 'block';
  const mod = await import(COMPILER_URL);
  const Compiler = mod.Compiler || (window.MINDAR && window.MINDAR.IMAGE && window.MINDAR.IMAGE.Compiler);
  if (!Compiler) throw new Error('Tracking compiler failed to load.');
  const compiler = new Compiler();
  await compiler.compileImageTargets([img], (p) => {
    barFill.style.width = Math.min(100, p).toFixed(0) + '%';
    setStatus(`Preparing the artwork for tracking… ${Math.min(100, p).toFixed(0)}%`);
  });
  const data = await compiler.exportData();
  bar.style.display = 'none';
  return URL.createObjectURL(new Blob([data]));
}

// If a pre-made targets.mind file sits in /assets, use it (much faster to start)
async function premadeTarget(url) {
  try { const r = await fetch(url, { method: 'HEAD' }); return r.ok ? url : null; } catch { return null; }
}

$('go').addEventListener('click', async () => {
  const mode = document.querySelector('input[name=mode]:checked').value;
  let imageSrc = SAMPLE.image, videoSrc = SAMPLE.video, targetSrc = null;

  if (mode === 'own') {
    const imgF = $('imgFile').files[0], vidF = $('vidFile').files[0];
    if (!imgF || !vidF) return setStatus('Pick both an image and a video first.', true);
    imageSrc = URL.createObjectURL(imgF);
    videoSrc = URL.createObjectURL(vidF);
  }

  $('go').disabled = true;

  // 1) Create the video now, inside the tap, so phones allow it to play later
  const video = document.createElement('video');
  Object.assign(video, { src: videoSrc, loop: true, muted: true, playsInline: true, crossOrigin: 'anonymous', preload: 'auto' });
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');
  video.play().then(() => video.pause()).catch(() => {});

  try {
    // 2) Get the tracking target
    const img = await loadImage(imageSrc);
    if (mode === 'sample') targetSrc = await premadeTarget(SAMPLE.target);
    if (!targetSrc) targetSrc = await compileTarget(img);

    // 3) Set up the AR scene
    setStatus('Starting camera…');
    const mindar = new MindARThree({
      container: $('ar'),
      imageTargetSrc: targetSrc,
      uiLoading: 'no', uiScanning: 'no', uiError: 'yes',
      filterMinCF: 0.0001, filterBeta: 0.001,   // smoother, less jittery tracking
    });
    const { renderer, scene, camera } = mindar;

    const aspect = (img.naturalHeight || img.height) / (img.naturalWidth || img.width);
    const texture = new THREE.VideoTexture(video);
    texture.colorSpace = THREE.SRGBColorSpace;
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(1, aspect),          // 1 = full width of the artwork
      new THREE.MeshBasicMaterial({ map: texture })
    );
    plane.visible = false;

    const anchor = mindar.addAnchor(0);
    anchor.group.add(plane);

    const frame = $('frame'), hint = $('hint');
    frame.style.aspectRatio = `${img.naturalWidth || img.width} / ${img.naturalHeight || img.height}`;
    const searching = (on) => { frame.style.display = hint.style.display = on ? 'block' : 'none'; };

    anchor.onTargetFound = () => { plane.visible = true; searching(false); video.play().catch(() => {}); };
    anchor.onTargetLost  = () => { plane.visible = false; searching(true); video.pause(); };

    await mindar.start();
    renderer.setAnimationLoop(() => renderer.render(scene, camera));

    $('start').style.display = 'none';
    $('controls').style.display = 'flex';
    searching(true);

    $('sound').addEventListener('click', () => {
      video.muted = !video.muted;
      $('sound').textContent = video.muted ? '🔇 Sound off' : '🔊 Sound on';
      if (plane.visible) video.play().catch(() => {});
    });

    document.addEventListener('visibilitychange', () => { if (document.hidden) video.pause(); });
  } catch (err) {
    console.error(err);
    bar.style.display = 'none';
    $('go').disabled = false;
    const msg = String(err && (err.message || err));
    setStatus(/Permission|NotAllowed/i.test(msg)
      ? 'Camera access was blocked. Allow the camera in your browser settings and try again.'
      : 'Something went wrong: ' + msg, true);
  }
});
</script>
</body>
</html>
